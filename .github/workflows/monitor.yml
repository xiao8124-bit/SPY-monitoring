name: FlashAlpha Level Monitor
 
on:
  schedule:
    # 备用保险：GitHub 自带 schedule（不完全可靠，主力靠 cron-job.org 外部触发 workflow_dispatch）
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "强制测试（忽略交易时段限制，休市时手动测试用）"
        type: boolean
        default: false
 
permissions:
  contents: write
 
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Run monitor (internal loop, ~3.3min cadence)
        env:
          SYMBOL: SPY
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ inputs.force_run }}
          POLL_INTERVAL_SECONDS: "200"
          LOOP_DURATION_SECONDS: "780"
          MOMENTUM_THRESHOLD_PCT: "0.2"
          CONTINUATION_THRESHOLD_PCT: "0.2"
          GAMMA_FLIP_BUFFER: "0.15"
          COOLDOWN_MINUTES: "15"
        run: python monitor.py
 
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            git diff --cached --quiet || git commit -m "update state [skip ci]"
            git push
          else
            echo "state.json 未生成（可能是非交易时段被跳过），无需提交。"
          fi
